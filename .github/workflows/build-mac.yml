name: Mac-App bauen

# Die DMG kann nur auf macOS entstehen (hdiutil), darum laeuft dieser Build
# auf einem macOS-Runner und haengt das Ergebnis als Download an den Lauf.

on:
  push:
    branches: [claude/jolly-euler-hcff6q, main]
    tags: ['v*']
    paths:
      - 'app/**'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typen pruefen
        run: npm run typecheck

      - name: Bauen
        run: npm run build

      - name: DMG packen
        # Ohne Zertifikat wird nicht signiert; afterPack setzt eine
        # Ad-hoc-Signatur, sonst startet die App auf Apple Silicon nicht.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --universal --publish never

      - name: DMG als Download anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: TANZSaal-Werbe-Studio-dmg
          path: app/release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: An Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/*.dmg
